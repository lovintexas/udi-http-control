<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>HTTP Control — Password Management</title>
<style>
*{box-sizing:border-box}
body{font-family:Arial,sans-serif;background:#f1f5f9;color:#1e293b;margin:0;padding:24px}
main{max-width:480px;margin:55px auto;background:white;padding:30px;border-radius:12px;box-shadow:0 5px 25px #0001}
h1{font-size:24px;color:#17365d;margin-top:0}
p{line-height:1.5;color:#475569}
label{display:block;font-weight:600;margin:18px 0 6px}
input{width:100%;padding:11px;border:1px solid #cbd5e1;border-radius:6px;font-size:16px}
button{background:#245b91;color:white;border:0;border-radius:6px;padding:12px 18px;cursor:pointer;font-size:15px;margin-top:22px}
button:hover{background:#17365d}
button:disabled{opacity:.6;cursor:wait}
a{color:#245b91}
#message{margin-top:18px;line-height:1.5;white-space:pre-wrap}
.error{color:#b91c1c}
.success{color:#047857}
.hidden{display:none}
.links{margin-top:25px}
</style>
</head>
<body>
<main>
<h1>HTTP Control</h1>
<h2 id="heading">Password Management</h2>
<p id="description">Checking password configuration...</p>

<form id="passwordForm" class="hidden">
<div id="currentGroup" class="hidden">
<label for="current">Current password</label>
<input id="current" type="password" autocomplete="current-password">
</div>

<div id="codeGroup" class="hidden">
<label for="code">Recovery code</label>
<input id="code" type="text" autocomplete="off" spellcheck="false">
</div>

<label for="password">New password (minimum 12 characters)</label>
<input id="password" type="password" minlength="12" maxlength="1024"
       autocomplete="new-password" required>

<label for="confirm">Confirm new password</label>
<input id="confirm" type="password" minlength="12" maxlength="1024"
       autocomplete="new-password" required>

<button id="submitButton" type="submit">Save Password</button>
</form>

<div id="message" role="status" aria-live="polite"></div>

<div class="links">
<a href="/editor">Open Endpoint Editor</a>
<span id="recoverLink" class="hidden"> | <a href="#" id="recover">Forgot password?</a></span>
<span id="changeLink" class="hidden"> | <a href="#" id="change">Change password</a></span>
</div>
</main>

<script>
"use strict";
let mode = "setup";

const $ = id => document.getElementById(id);

function setMode(next) {
  mode = next;
  $("message").textContent = "";
  $("message").className = "";
  $("passwordForm").classList.remove("hidden");
  $("currentGroup").classList.toggle("hidden", mode !== "change");
  $("codeGroup").classList.toggle("hidden", mode !== "recover");
  $("current").required = mode === "change";
  $("code").required = mode === "recover";
  $("recoverLink").classList.toggle("hidden", mode !== "change");
  $("changeLink").classList.toggle("hidden", mode !== "recover");

  if (mode === "setup") {
    $("heading").textContent = "Create Administrator Password";
    $("description").textContent =
      "Welcome. Create a password to protect your HTTP Control configuration.";
    $("submitButton").textContent = "Create Password";
  } else if (mode === "change") {
    $("heading").textContent = "Change Administrator Password";
    $("description").textContent =
      "Enter your current password and choose a new password.";
    $("submitButton").textContent = "Change Password";
  } else {
    $("heading").textContent = "Recover Administrator Password";
    $("description").textContent =
      "Connect to your eisy over SSH, run: python3 ~/http-control/http_control_auth.py reset, then enter the temporary recovery code below.";
    $("submitButton").textContent = "Reset Password";
  }
}

$("recover").addEventListener("click", event => {
  event.preventDefault();
  setMode("recover");
});

$("change").addEventListener("click", event => {
  event.preventDefault();
  setMode("change");
});

$("passwordForm").addEventListener("submit", async event => {
  event.preventDefault();

  const password = $("password").value;
  const confirm = $("confirm").value;

  if (password !== confirm) {
    $("message").textContent = "Passwords do not match.";
    $("message").className = "error";
    return;
  }

  const payload = {
    new_password: password,
    confirm_password: confirm
  };

  if (mode === "change") {
    payload.current_password = $("current").value;
  }
  if (mode === "recover") {
    payload.code = $("code").value.trim();
  }

  $("submitButton").disabled = true;
  $("message").textContent = "Saving...";

  try {
    const response = await fetch("/api/auth/" + mode, {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      credentials: "same-origin",
      cache: "no-store",
      body: JSON.stringify(payload)
    });

    if (!response.ok) {
      throw new Error(
        response.status === 403
          ? "Authentication failed. Check your current password or recovery code."
          : "Password update failed (HTTP " + response.status + ")."
      );
    }

    $("passwordForm").reset();
    $("message").className = "success";
    $("message").textContent =
      "Password saved successfully. Your new password is now active. " +
      "Your browser may require a new login to access the editor.";

    if (mode === "setup") {
      setMode("change");
      $("message").className = "success";
      $("message").textContent =
        "Administrator password created. You can now open the Endpoint Editor.";
    }
  } catch (error) {
    $("message").className = "error";
    $("message").textContent = error.message;
  } finally {
    $("submitButton").disabled = false;
  }
});

(async () => {
  try {
    const response = await fetch("/api/auth/status", {cache:"no-store"});
    if (!response.ok) throw new Error("Unable to check password status");
    const status = await response.json();
    setMode(status.configured ? "change" : "setup");
  } catch (error) {
    $("description").textContent = error.message;
  }
})();
</script>
</body>
</html>
