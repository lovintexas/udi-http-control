<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>HTTP Control — Login</title>
<style>
*{box-sizing:border-box}
body{font-family:Arial,sans-serif;background:#f1f5f9;color:#1e293b;margin:0;padding:24px}
main{max-width:420px;margin:80px auto;background:white;padding:30px;border-radius:12px;box-shadow:0 5px 25px #0001}
h1{font-size:24px;color:#17365d}
label{display:block;font-weight:600;margin:20px 0 6px}
input{width:100%;padding:11px;border:1px solid #cbd5e1;border-radius:6px;font-size:16px}
button{background:#245b91;color:white;border:0;border-radius:6px;padding:12px 18px;cursor:pointer;margin-top:22px}
button:disabled{opacity:.6}
p{color:#475569}
#error{color:#b91c1c;margin-top:16px}
a{color:#245b91}
</style>
</head>
<body>
<main>
<h1>HTTP Control</h1>
<h2>Administrator Login</h2>
<p>Sessions expire after 60 minutes of inactivity.</p>

<form id="loginForm">
<label for="username">Username</label>
<input id="username" name="username" type="text"
       value="admin" autocomplete="username" required>
<label for="password">Administrator password</label>
<input id="password" type="password"
       autocomplete="current-password" required autofocus>
<button id="submitButton" type="submit">Log In</button>
</form>

<div id="error" role="alert"></div>
<p><a href="/auth">Password Management / Recovery</a></p>
</main>

<script>
"use strict";

document.getElementById("loginForm").addEventListener("submit", async event => {
  event.preventDefault();

  const button = document.getElementById("submitButton");
  const error = document.getElementById("error");

  button.disabled = true;
  error.textContent = "";

  try {
    const response = await fetch("/api/auth/login", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      credentials: "same-origin",
      cache: "no-store",
      body: JSON.stringify({
        password: document.getElementById("password").value
      })
    });

    if (!response.ok) {
      throw new Error(
        response.status === 429
          ? "Too many failed login attempts. Please wait 15 minutes and try again."
          : response.status === 403
          ? "Incorrect administrator password."
          : "Login failed (HTTP " + response.status + ")."
      );
    }

    window.location.replace("/editor");

  } catch (err) {
    error.textContent = err.message;
    document.getElementById("password").value = "";
    button.disabled = false;
  }
});
</script>
</body>
</html>
